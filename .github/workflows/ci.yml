name: ci
on:
  push:
    branches: [main]
  pull_request:

# The suite took ~40 min in one job (M8); M11a splits it into parallel jobs by test area.
# `make ci` still runs everything in one go locally.
# a newer push to the same branch cancels the run still going for the older one (Actions minutes,
# 12 Nov 2026)
# the token reads the code only; no job writes (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs, plans, previews and design files only: the real-names guard runs, the rest is skipped
  # (a skipped job passes, so the deploy check still finds ci green on the commit).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did code change?
        id: diff
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$changed"
          # docs, designs and the hand-run preview scripts never need the tests (ci-cost; not
          # marketing/, which the website reads, nor .claude/, which the export test reads)
          other=$(echo "$changed" | grep -vE '^(docs|design)/|^tests/ui/preview_[a-z0-9_]+\.py$|\.md$' || true)
          if [ -z "$other" ]; then printf 'code=false\nsite=false\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          # the website alone (blog posts, site pages) plus a release's version lines: the site's
          # tests and the guards in one short job instead of the whole suite (owner, 24 Nov 2026)
          bump='^(pyproject\.toml|uv\.lock|othor/__init__\.py|tests/web/test_version_bump\.py)$'
          rest=$(echo "$other" | grep -vE "^othor_site/|^marketing/|^tests/ui/blog_[a-z0-9_]+\.json$|$bump" || true)
          lines=$(git diff "$BEFORE" "$GITHUB_SHA" -- pyproject.toml uv.lock othor/__init__.py \
            tests/web/test_version_bump.py | grep -E '^[-+][^-+]' | grep -v version || true)
          if [ -z "$rest" ] && [ -z "$lines" ]; then
            printf 'code=false\nsite=true\n'
          else
            printf 'code=true\nsite=false\n'
          fi >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.diff.outputs.code == 'false'
        with:
          version: "0.13.7"
      - name: Guards (docs-only push)
        if: steps.diff.outputs.code == 'false'
        run: uv sync --frozen && uv run pytest tests/guards -q

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install
        run: uv sync --frozen
      - name: Lint, types, import contracts, SPDX lines, licences, CSS build
        run: make lint type contracts spdx licences css
      # 0.39: every shipped module imports with the production dependencies alone (0.37 left
      # PyYAML in the dev group and signed-in Home failed in production)
      - name: Runtime imports, production dependencies only
        run: make runtime-imports PROD_ENV="$RUNNER_TEMP/prod-env"

  # A website-only push (see changes): the site's tests, the guards and the version check.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: tests · website only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Start metadata DB and sample sources
        run: docker compose up -d meta-db sales-dw erp-db --wait
      - name: Install
        run: uv sync --frozen
      - name: CSS
        run: make css
      - name: Tests
        run: uv run pytest tests/guards tests/web/test_version_bump.py --durations=30 --durations-min=10

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        area:
          # 24 Nov 2026: unit, web and e2e run their test files in parallel inside the job
          # (pytest-xdist, one process per core; each process has its own test databases), so a
          # job takes about half the time and no extra job's setup is billed (docs/plans/ci-cost.md).
          # The web tests are one job again (two from 20 Nov, four before).
          - name: unit, detectors, guards, ui, sample company
            paths: tests/unit tests/detectors tests/guards tests/ui tests/sample_company
            parallel: "-n auto --dist loadfile"
          - name: web
            paths: tests/web
            parallel: "-n auto --dist loadfile"
          - name: e2e nights, sample run
            paths: tests/e2e tests/integration/test_run_sample.py tests/integration/test_series_versions.py
            parallel: "-n auto --dist loadfile"
          # one at a time: test_seed reloads the shared sample databases the others read
          - name: integration, replay
            paths: tests/integration --ignore=tests/integration/test_run_sample.py --ignore=tests/integration/test_series_versions.py
    name: tests · ${{ matrix.area.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Start metadata DB and sample sources
        run: docker compose up -d meta-db sales-dw erp-db --wait
      - name: Install
        run: uv sync --frozen
      - name: Chromium for the responsive, stress and compare tests
        # The runner image already has Chromium's system libraries. When Ubuntu's mirror is
        # unreachable, apt waits ~10 min per try (11 Nov 2026: 31 min lost to three tries), so
        # give it 2 minutes once, then install Chromium alone (the tests pass with it).
        run: |
          timeout 120 uv run playwright install --with-deps chromium && exit 0
          echo "::warning::system packages unreachable; installing Chromium without them"
          uv run playwright install chromium
      - name: CSS
        run: make css
      - name: CSS is current
        run: make css-check
      - name: Tests
        env:
          PATHS: ${{ matrix.area.paths }}
          PARALLEL: ${{ matrix.area.parallel }}
        run: |
          nproc
          # shellcheck disable=SC2086  # lists of paths and options, split on purpose
          uv run pytest $PATHS $PARALLEL --durations=30 --durations-min=10
