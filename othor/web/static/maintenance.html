<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Starting up · Othor AI</title>
<link rel="stylesheet" href="/static/css/fonts.css">
<style>
/* Static on purpose: served with no database and no templates (M11a). Values from theme.css. */
body { margin: 0; background: #FFFFFF; color: #1F2A37; font-family: "Inter", system-ui, sans-serif; }
header { display: flex; align-items: center; height: 56px; padding: 0 24px; border-bottom: 1px solid #E3E6EA; }
.brand { font-weight: 600; font-size: 13px; letter-spacing: 0.06em; color: #1F2A37; text-decoration: none; }
main { display: flex; justify-content: center; padding: 96px 16px; }
.card { max-width: 446px; width: 100%; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; padding: 32px; }
.code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: #6A737D; margin: 0; }
.title { font-size: 16px; font-weight: 600; margin: 10px 0 0; }
.text { font-size: 12px; color: #5B6B7B; margin: 10px 0 0; }
a.btn { display: inline-block; margin-top: 12px; padding: 7px 12px; border: 1px solid #DDE2E8; border-radius: 8px; color: #1F2A37; font-size: 13px; text-decoration: none; }
a.btn:focus-visible { outline: 2px solid #0A78A4; outline-offset: 2px; }
footer { text-align: center; color: #6A737D; font-size: 12px; padding: 24px; }
</style>
</head>
<body>
<header><a class="brand" href="/">OTHOR AI</a></header>
<main><div class="card">
  <p class="code">503 · maintenance</p>
  <p class="title">Othor AI is starting up or under maintenance. Try again in a minute.</p>
  <a class="btn" href="">Reload</a>
</div></main>
<footer>© 2026 Othor AI Private Limited</footer>
</body>
</html>
